name: CI

# The Unity 6.5 breakage reached a user before anyone noticed, and it took mosaic-pro
# down with it — every Pro asmdef compiles against Mosaic.Bridge.Contracts/Core. This
# workflow exists so an upstream Unity change is caught here rather than in someone's
# Editor.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Unity ships new patch releases continuously; a weekly run catches a deprecation
    # that lands without any change on our side.
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, no secrets, no Unity licence. Catches the exact class of regression that
  # caused the 6.5 outage: a deprecated identity API creeping back into the codebase.
  api-guard:
    name: Deprecated Unity API guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No deprecated object-identity APIs outside the compat shim
        run: |
          set -euo pipefail
          # UnityIds owns every one of these; anywhere else they break Unity 6.5+.
          PATTERN='GetInstanceID\(\)|objectReferenceInstanceIDValue|InstanceIDToObject|EntityIdToObject|FindObjectsSortMode|FindObjectOfType<'
          # Exclusions, each deliberate:
          #  UnityIds.cs / UnityIdsTests.cs  — the shim itself and the tests pinning it.
          #  SimSphericalGravityTool.cs      — the match is inside a string literal holding a
          #                                    MonoBehaviour we generate into the user's project.
          #                                    That emitted code carries its own
          #                                    #if UNITY_6000_5_OR_NEWER guard; grep cannot tell
          #                                    code from generated-source literals.
          if hits=$(grep -rnE "$PATTERN" packages/com.mosaic.bridge \
                      --include='*.cs' \
                    | grep -v 'Editor/Contracts/Compat/UnityIds.cs' \
                    | grep -v 'Tests/Unit/Compat/UnityIdsTests.cs' \
                    | grep -v 'Editor/Tools/Simulation/SimSphericalGravityTool.cs'); then
            echo "::error::Deprecated Unity identity API used outside Mosaic.Bridge.Contracts.Compat.UnityIds."
            echo "Route it through UnityIds.Of / Resolve / ResolveAny / FindAll / ObjectReferenceId instead."
            echo "$hits"
            exit 1
          fi
          echo "Clean — all object identity goes through UnityIds."

      - name: Package sources must not be gitignored
        # The root .gitignore carries Unity-project globs, and [Bb]uild/ silently swallowed
        # Editor/Tools/Build/ for four months — the build tool shipped as an empty folder.
        # This is the check that would have caught it on day one.
        run: |
          hidden=$(git ls-files --others --ignored --exclude-standard -- packages/com.mosaic.bridge/)
          if [ -n "$hidden" ]; then
            echo "::error::These package sources are gitignored and will never ship:"
            echo "$hidden"
            exit 1
          fi
          echo "No package sources are hidden by .gitignore."

      - name: Reject hand-authored or duplicate .meta GUIDs
        # GUIDs written by walking hex nibbles occupy a tiny space, so they collide with
        # other packages. One such collision with com.unity.purchasing dropped a file from
        # that package and broke compilation project-wide — and the error named the victim,
        # not the bridge.
        run: |
          python3 - <<'PY'
          import os, re, sys, collections
          def structured(g):
              for seq in ([int(g[i],16) for i in range(0,32,2)],
                          [int(g[i],16) for i in range(1,32,2)]):
                  for p in range(1, 7):
                      if all(seq[i] == seq[i % p] for i in range(len(seq))): return True
                  for mod in (10, 16):
                      d = (seq[1] - seq[0]) % mod
                      if d and all((seq[i+1]-seq[i]) % mod == d for i in range(len(seq)-1)):
                          return True
              return False

          seen, bad = collections.defaultdict(list), []
          for root, dirs, files in os.walk('packages/com.mosaic.bridge'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if not f.endswith('.meta'): continue
                  p = os.path.join(root, f)
                  m = re.search(r'^guid: ([0-9a-f]{32})$',
                                open(p, encoding='utf-8', errors='ignore').read(), re.M)
                  if not m: continue
                  seen[m.group(1)].append(p)
                  if structured(m.group(1)): bad.append(f'{p}  {m.group(1)}')

          dups = [f'{g}: {v}' for g, v in seen.items() if len(v) > 1]
          if bad: print('Hand-authored GUIDs (regenerate with uuid.uuid4().hex):', *bad, sep='\n  ')
          if dups: print('Duplicate GUIDs:', *dups, sep='\n  ')
          if not bad and not dups:
              print(f'{sum(len(v) for v in seen.values())} .meta GUIDs look random and unique.')
          sys.exit(1 if bad or dups else 0)
          PY

      # Mosaic ships against maintained Unity LTS only. Asked live rather than from a list,
      # because "which streams are LTS" changes on Unity's calendar and any table written here
      # would be wrong within a year — and a stale table does not merely miss defects, it invents
      # them. Note this governs the DECLARED FLOOR, not the test matrix below: exercising a
      # SUPPORTED release like 6000.5 is forward-compat coverage and entirely intended.
      - name: Declared Unity floor is a maintained LTS stream
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request
          from datetime import datetime, timezone

          floor = json.load(open('packages/com.mosaic.bridge/package.json'))['unity']
          print(f'declared floor: {floor}')
          if re.search(r'\d+\.\d+\.\d+[ab]\d+', floor):
              sys.exit(f'::error::{floor} is a prerelease — never a declared floor')

          api = 'https://services.api.unity.com/unity/editor/release/v1/releases'
          try:                                   # limit>25 is rejected with a bare 400
              with urllib.request.urlopen(f'{api}?limit=25&order=RELEASE_DATE_DESC&stream=LTS',
                                          timeout=25) as r:
                  results = json.loads(r.read())['results']
          except Exception as e:                 # transient network is not a policy violation
              print(f'::warning::could not reach Unity release API ({e}) — floor unverified')
              sys.exit(0)

          now, live = datetime.now(timezone.utc), {}
          for rel in results:
              stream = re.match(r'(\d+\.\d+)', rel['version']).group(1)
              age = (now - datetime.strptime(rel['releaseDate'][:10], '%Y-%m-%d')
                     .replace(tzinfo=timezone.utc)).days / 30.44
              if age <= 6:
                  live.setdefault(stream, rel['version'])
          print('maintained LTS today:', ', '.join(sorted(live)) or 'none seen')

          stream = re.match(r'(\d+\.\d+)', floor).group(1)
          if stream not in live:
              sys.exit(f'::error::{floor} is not a maintained LTS stream. '
                       f'Move to {" or ".join(sorted(live, reverse=True)[:2])}.')
          print(f'OK — {stream} is LTS and shipping (newest {live[stream]})')
          PY

      - name: Package manifest and changelog agree
        run: |
          set -euo pipefail
          v=$(python3 -c "import json;print(json.load(open('packages/com.mosaic.bridge/package.json'))['version'])")
          echo "com.mosaic.bridge version: $v"
          grep -q "\[$v\]" packages/com.mosaic.bridge/CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no entry for $v"; exit 1; }

  node:
    name: node — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mcp-server, create-bridge]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build
        run: npm run build --if-present
      - run: npm test
      - name: No vulnerabilities in what we publish
        # Dev-only advisories don't ship; production ones reach every user.
        run: npm audit --omit=dev --audit-level=moderate

  unity:
    name: Unity ${{ matrix.unity }}
    runs-on: ubuntu-latest
    # Needs a Unity licence. Without the secret the job is skipped rather than failing
    # every run red, which would train people to ignore CI.
    if: ${{ github.repository_owner == 'MosaicXR-AI' }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported editor and the current recommended one. 6000.6.0b5+ is
        # deliberately absent — the EntityId layout changed there and it is unsupported.
        unity: ['6000.3.10f1', '6000.5.5f1']
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no licence is configured
        id: gate
        run: |
          if [ -z "${{ secrets.UNITY_LICENSE }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE not set — skipping the Unity matrix. Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD to enable it."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        if: steps.gate.outputs.run == 'true'
        with:
          path: TestProject/Library
          key: Library-${{ matrix.unity }}-${{ hashFiles('packages/com.mosaic.bridge/**') }}
          restore-keys: Library-${{ matrix.unity }}-

      - name: Create a consuming project
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p TestProject/Assets TestProject/Packages TestProject/ProjectSettings
          cat > TestProject/Packages/manifest.json <<'JSON'
          {
            "dependencies": {
              "com.mosaic.bridge": "file:../../packages/com.mosaic.bridge",
              "com.unity.nuget.newtonsoft-json": "3.2.1",
              "com.unity.test-framework": "1.4.6",
              "com.unity.ugui": "2.5.0"
            },
            "testables": ["com.mosaic.bridge"]
          }
          JSON
          echo "m_EditorVersion: ${{ matrix.unity }}" > TestProject/ProjectSettings/ProjectVersion.txt

      - name: EditMode tests
        if: steps.gate.outputs.run == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TestProject
          unityVersion: ${{ matrix.unity }}
          testMode: EditMode
          # Integration and Regression need a live bridge, and BridgeBootstrap refuses to
          # start under -batchmode by design (see TESTING.md). Unit is the CI-safe set.
          customParameters: -testCategory !Integration;!Regression
          checkName: EditMode ${{ matrix.unity }}

      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: test-results-${{ matrix.unity }}
          path: artifacts
